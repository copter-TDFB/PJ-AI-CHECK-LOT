key: grade_bag
display_name: "Grade Bag"
pipeline: detector_ocr
conf_threshold: 0.6
accuracy: 0.96
gate_on_lot: true
lot_short_fallback: false
sub_regions: []

lot_patterns:
  - '(?i)LOT\s*[:\.\-]?\s*([A-Z]{0,3}\d{6,}[A-Z0-9]*)'
  - '\b([A-Z]{1,3}\d{6,}[A-Z0-9]*)\b'

fields_extracted: [lot, exp, product, size]
sheet_checks: [lot, exp, product]
post_ocr_fixes: [lot_alpha_prefix]

message_template_key: default_full
model_classifier_label: grade_bag
detector_yolo_prefixes: [grade_bag_lot, grade_bag_product]
