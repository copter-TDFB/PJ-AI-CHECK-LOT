key: retail_sachet
display_name: "Retail Sachet"
pipeline: detector_ocr
conf_threshold: 0.6
accuracy: 0.95
gate_on_lot: true
lot_short_fallback: false
sub_regions: []
detection_mode: single

lot_patterns:
  # happy path: อ่าน LOT ชัด
  - '(?i)LOT\s*[:\.\-]?\s*(\d{4})\b'
  # dot-matrix prefix เพี้ยน (LOT -> ECT ฯลฯ): lot ของ class นี้เป็นเลข 4 หลักเสมอ นำหน้าด้วย prefix 2-3 ตัว
  # negative lookahead กันคำวันที่ (EXP/BBD/MFG ฯลฯ) ไม่ให้ถูกจับเป็น lot
  - '(?i)\b(?!(?:EXP|BBD|BBE|MFG|EX|BB)\b)[A-Z]{2,3}\s*[:\.\-]?\s*(\d{4})\b'

fields_extracted: [lot, exp]
sheet_checks: [lot, exp]
post_ocr_fixes: []

message_template_key: lot_exp
model_classifier_label: retail_sachet
detector_yolo_prefixes: [retail_sachet_lot]
