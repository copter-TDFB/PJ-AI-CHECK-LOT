key: 30_sachet
display_name: "Matcha Back Sticker (30 Sachet)"
pipeline: detector_ocr
conf_threshold: 0.6
accuracy: 1.0   # 40/40 บน test set (confusion matrix 2026-06-30)
gate_on_lot: true
lot_short_fallback: false
sub_regions: []
detection_mode: single

# สติกเกอร์หลังกล่อง MATCHAZUKI — lot ขึ้นต้นด้วยตัวอักษร 2 ตัว (EX/CR) ตามด้วยเลขยาว
# และอาจมีบล็อกตัวอักษร 3 ตัวแทรกกลาง (เช่น CR0010HKW023618126R) เหมือน back_label
lot_patterns:
  - '(?i)LOT\s*[:\.\-]?\s*([A-Z]{0,3}(?:\d{6,}|\d{4,}[A-Z]{3}\d{2,})[A-Z0-9]*)'
  - '(?i)LOT\s*[:\.\-]?\s*([A-Z0-9\-]{4,})'

fields_extracted: [lot, exp, product]
sheet_checks: [lot, exp, product]
post_ocr_fixes: []

message_template_key: default_full
model_classifier_label: 30_sachet
detector_yolo_prefixes: [30_sachet]

# keyword เป็น list ซ้อน = AND (ต้องเจอครบทุกคำ); string เดี่ยว = เจอตัวเดียวพอ
# ลำดับสำคัญ — _match_aliases คืน entry แรกที่ตรง:
#   Medium B-Grade [Medium Rich + B Grade] / Classic B-Grade [Classic Rich + B Grade]
#   -> Classic 500g [Classic Rich + 500 g] -> Excellent [Excellent + 30 Sachets]
# ทุก entry ใช้ AND term เฉพาะตัว (B Grade / 500 g / 30 Sachets) จึงแยกกันชัด ไม่ชน
product_aliases:
  - canonical: "B-Grade Matcha Medium Rich 100 g"
    keywords:
      - ["Medium Rich", "B Grade"]    # AND
  - canonical: "B-Grade Matcha Classic Rich 100 g"
    keywords:
      - ["Classic Rich", "B Grade"]   # AND — ต้องมาก่อน Classic 500g
  - canonical: "Classic Rich 95% 500 g"
    keywords:
      - ["Classic Rich", "500 g"]   # AND — pin ขนาด 500g (กันชนรุ่นขนาดอื่น/B-Grade)
  - canonical: "Excellent 3 g (30 Sachets)"
    keywords:
      - ["Excellent", "30 Sachets"]   # AND — ต้องเจอทั้ง Excellent และ 30 Sachets

image_count: 200
